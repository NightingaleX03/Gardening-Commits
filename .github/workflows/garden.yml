name: Example garden

# Runs this repo's own action to keep the example in the README up to date,
# which also checks that the action still works after every change.
on:
  schedule:
    - cron: '17 3 * * *' # once a day
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['action.yml', 'garden.config.ts', 'src/**', 'package.json', 'package-lock.json', '.github/workflows/garden.yml']

permissions:
  contents: write

concurrency:
  group: example-garden
  cancel-in-progress: false

jobs:
  garden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./
        with:
          output-dir: example
